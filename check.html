<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check</title>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    .wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; white-space: nowrap; }
    th { background: #eee; }
    input { display: block; margin: 8px 0; padding: 8px; }
  </style>
</head>
<body>
  <div id="login">
    <h2>Admin login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Log in</button>
  </div>

  <div id="view" style="display:none">
    <h2>All Submitted Details</h2>
    <div class="wrap"><table id="t"></table></div>
    <br><button onclick="logout()">Log out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient("YOUR_PROJECT_URL", "YOUR_ANON_KEY");

    async function login() {
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("pass").value
      });
      if (error) return alert("Wrong email or password");
      show();
    }

    async function logout() { await sb.auth.signOut(); location.reload(); }

    async function show() {
      const { data: rows, error } = await sb.from("entries")
        .select("data, created_at").order("created_at");
      if (error) return alert("Could not load entries");
      document.getElementById("login").style.display = "none";
      document.getElementById("view").style.display = "block";

      const t = document.getElementById("t");
      t.innerHTML = "";
      if (!rows.length) { t.innerHTML = "<tr><td>No entries yet</td></tr>"; return; }

      const list = rows.map(r => ({
        ...r.data,
        submittedAt: new Date(r.created_at).toLocaleString("en-GB", { timeZone: "Africa/Lagos" })
      }));
      const keys = [...new Set(list.flatMap(Object.keys))];
      const head = t.insertRow();
      keys.forEach(k => {
        const th = document.createElement("th");
        th.textContent = k;
        head.appendChild(th);
      });
      list.forEach(d => {
        const row = t.insertRow();
        keys.forEach(k => row.insertCell().textContent = d[k] ?? "");
      });
    }

    sb.auth.getSession().then(({ data }) => { if (data.session) show(); });
  </script>
</body>
</html>
