<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Sign In · Nexora Financial</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-name {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f172a;
    }

    .brand-subtitle {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #64748b;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
      color: #111827;
    }

    .intro {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: #172033;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 72px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      padding: 6px;
    }

    .sign-in {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .sign-in:hover {
      background: #1d4ed8;
    }

    .sign-in:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .register {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
      color: #64748b;
    }

    .register a {
      color: #2563eb;
      font-weight: 800;
      text-decoration: none;
    }

    .demo-note {
      margin-top: 25px;
      padding-top: 17px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: .2px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 27px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      <div class="brand-name">NEXORA</div>
      <div class="brand-subtitle">FINANCIAL SERVICES</div>
    </div>

    <h1>Welcome back</h1>

    <p class="intro">
      Sign in to access your Nexora Financial account.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="sign-in"
        id="signInButton"
      >
        Sign In
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="register">
      Don't have an account?
      <a href="./register.html">Create account</a>
    </div>

    <div class="demo-note">
      NEXORA FINANCIAL · SIMULATED ACCOUNT
    </div>

  </div>


  <script>

    /*
    ============================================================
    NEXORA FINANCIAL
    NEW SUPABASE PROJECT
    ============================================================
    */

    const SUPABASE_URL =
      "https://enstgbpcgkdnwhhlsnhh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";


    /*
    ============================================================
    ELEMENTS
    ============================================================
    */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signInButton =
      document.getElementById("signInButton");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    /*
    ============================================================
    SHOW / HIDE PASSWORD
    ============================================================
    */

    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";
        showPassword.textContent = "Show";

      }

    });


    /*
    ============================================================
    MESSAGE
    ============================================================
    */

    function showMessage(text, type) {

      message.textContent = text;
      message.className = "message " + type;

    }


    function clearMessage() {

      message.textContent = "";
      message.className = "message";

    }


    /*
    ============================================================
    LOGIN
    ============================================================
    */

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      clearMessage();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      signInButton.disabled = true;
      signInButton.textContent = "Signing in...";


      try {

        /*
        --------------------------------------------------------
        STEP 1
        Sign in with Supabase
        --------------------------------------------------------
        */

        const loginResponse =
          await fetch(
            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
            {
              method: "POST",

              headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email: email,
                password: password
              })
            }
          );


        const loginData =
          await loginResponse.json();


        if (!loginResponse.ok) {

          throw new Error(
            loginData?.error_description ||
            loginData?.msg ||
            loginData?.message ||
            "Invalid email or password."
          );

        }


        /*
        --------------------------------------------------------
        STEP 2
        Save the Supabase session
        --------------------------------------------------------
        */

        const accessToken =
          loginData.access_token;

        const refreshToken =
          loginData.refresh_token;


        if (!accessToken) {

          throw new Error(
            "Login succeeded but no session was returned."
          );

        }


        /*
        Store the session so dashboard/admin can use it.
        */

        localStorage.setItem(
          "nexora_access_token",
          accessToken
        );

        if (refreshToken) {

          localStorage.setItem(
            "nexora_refresh_token",
            refreshToken
          );

        }


        /*
        --------------------------------------------------------
        STEP 3
        Check the logged-in user's profile
        --------------------------------------------------------
        */

        let isAdmin = false;


        try {

          const profileResponse =
            await fetch(
              `${SUPABASE_URL}/rest/v1/profiles?select=is_admin&id=eq.${encodeURIComponent(loginData.user.id)}&limit=1`,
              {
                method: "GET",

                headers: {
                  "apikey": SUPABASE_KEY,
                  "Authorization": `Bearer ${accessToken}`,
                  "Content-Type": "application/json"
                }
              }
            );


          if (profileResponse.ok) {

            const profiles =
              await profileResponse.json();


            if (
              Array.isArray(profiles) &&
              profiles.length > 0
            ) {

              isAdmin =
                profiles[0].is_admin === true;

            }

          }

        } catch (profileError) {

          /*
          If the profile check fails, treat the account
          as a NORMAL USER rather than sending it to Admin.
          */

          console.error(
            "Profile check failed:",
            profileError
          );

          isAdmin = false;

        }


        /*
        --------------------------------------------------------
        STEP 4
        ROUTING
        --------------------------------------------------------
        */

        showMessage(
          "Login successful. Opening your account...",
          "success"
        );


        /*
        ONLY an account whose profile explicitly contains
        is_admin = true can enter Admin V3.
        */

        if (isAdmin === true) {

          window.location.replace(
            "./admin.html?v=3000"
          );

        } else {

          window.location.replace(
            "./dashboard.html?v=3000"
          );

        }

      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );


        /*
        If login fails, remove any partial session.
        */

        localStorage.removeItem(
          "nexora_access_token"
        );

        localStorage.removeItem(
          "nexora_refresh_token"
        );


        showMessage(
          error.message ||
          "Unable to sign in. Please check your details and try again.",
          "error"
        );


        signInButton.disabled = false;
        signInButton.textContent = "Sign In";

      }

    });

  </script>

</body>
</html>
