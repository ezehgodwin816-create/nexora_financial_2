<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nexora Financial</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo h1 {
      font-size: 30px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -1px;
    }

    .logo span {
      color: #2563eb;
    }

    .logo p {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    .card h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: white;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }

    .bottom a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .bottom a:hover {
      text-decoration: underline;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .forgot a {
      color: #2563eb;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .demo-note {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>Nexora <span>Financial</span></h1>
      <p>Secure digital banking experience</p>
    </div>

    <div class="card">

      <h2>Welcome back</h2>
      <p class="subtitle">
        Sign in to access your Nexora Financial account.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="forgot">
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" id="loginButton">
          Sign in
        </button>

      </form>

      <div class="bottom">
        Don't have an account?
        <a href="./register.html">Create account</a>
      </div>

      <div class="demo-note">
        Nexora Financial is a simulated banking experience.
      </div>

    </div>

  </div>


  <script>
    /*
      NEXORA FINANCIAL
      Current Supabase project
    */

    const SUPABASE_URL =
      "https://enstgbpcgkdnwhhlsnhh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";


    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");


    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }


    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }


    function saveSession(session) {
      if (!session) return;

      if (session.access_token) {
        localStorage.setItem(
          "nexora_access_token",
          session.access_token
        );
      }

      if (session.refresh_token) {
        localStorage.setItem(
          "nexora_refresh_token",
          session.refresh_token
        );
      }
    }


    async function getCurrentUser(accessToken) {

      const response = await fetch(
        `${SUPABASE_URL}/auth/v1/user`,
        {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("Unable to verify logged-in user.");
      }

      return await response.json();
    }


    async function checkAdmin(user, accessToken) {

      /*
        IMPORTANT:
        Query the profile using the user's access token,
        not the publishable key.
      */

      const url =
        `${SUPABASE_URL}/rest/v1/profiles` +
        `?select=is_admin` +
        `&id=eq.${encodeURIComponent(user.id)}` +
        `&limit=1`;

      const response = await fetch(url, {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        }
      });


      if (!response.ok) {
        console.error(
          "Admin profile check failed:",
          response.status,
          await response.text()
        );

        return false;
      }


      const profiles = await response.json();

      console.log("Nexora profile check:", profiles);


      if (!Array.isArray(profiles) || profiles.length === 0) {
        return false;
      }


      return profiles[0].is_admin === true;
    }


    async function redirectAfterLogin(session) {

      const accessToken = session.access_token;

      /*
        Get the actual authenticated user.
      */
      const user = await getCurrentUser(accessToken);

      console.log("Logged-in user:", user.id, user.email);


      /*
        Check profiles.is_admin.
      */
      const isAdmin = await checkAdmin(
        user,
        accessToken
      );

      console.log("Nexora admin status:", isAdmin);


      if (isAdmin === true) {

        showMessage(
          "Admin account detected. Opening Admin V3...",
          "success"
        );

        /*
          Short delay makes sure the session is stored
          before the admin page loads.
        */
        setTimeout(() => {
          window.location.replace(
            "./admin.html?v=3001"
          );
        }, 300);

      } else {

        showMessage(
          "Login successful. Opening your dashboard...",
          "success"
        );

        setTimeout(() => {
          window.location.replace(
            "./dashboard.html?v=3001"
          );
        }, 300);
      }
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      clearMessage();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {
        showMessage(
          "Please enter your email and password."
        );
        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";


      try {

        /*
          Sign in through Supabase Auth.
        */

        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          console.error(
            "Supabase login error:",
            data
          );

          throw new Error(
            data.error_description ||
            data.msg ||
            data.message ||
            "Invalid email or password."
          );
        }


        if (!data.access_token) {
          throw new Error(
            "Login succeeded but no access token was returned."
          );
        }


        /*
          Save the session before redirecting.
        */

        saveSession(data);


        /*
          Check admin status and redirect.
        */

        await redirectAfterLogin(data);


      } catch (error) {

        console.error(
          "Nexora login error:",
          error
        );

        showMessage(
          error.message ||
          "Unable to sign in. Please try again."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Sign in";
      }

    });


    forgotPassword.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        if (!email) {
          showMessage(
            "Enter your email address first, then select Forgot password."
          );
          emailInput.focus();
          return;
        }


        try {

          showMessage(
            "Password reset is not configured yet.",
            "error"
          );

        } catch (error) {

          showMessage(
            "Unable to process password reset."
          );

        }

      }
    );
  </script>

</body>
</html>
