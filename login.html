<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Nexora Financial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 30px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
        }

        .logo span {
            color: #2563eb;
        }

        .logo p {
            margin-top: 7px;
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }

        .card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 18px;
        }

        .forgot a {
            color: #2563eb;
            font-size: 13px;
            text-decoration: none;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .bottom a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">

        <h1>
            Nexora <span>Financial</span>
        </h1>

        <p>
            Secure digital banking experience
        </p>

    </div>


    <div class="card">

        <h2>
            Welcome back
        </h2>

        <p class="subtitle">
            Sign in to access your Nexora Financial account.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div class="forgot">

                <a
                    href="#"
                    id="forgotPassword"
                >
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Sign in
            </button>

        </form>


        <div class="bottom">

            Don't have an account?

            <a href="./register.html">
                Create account
            </a>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://enstgbpcgkdnwhhlsnhh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";


const form =
    document.getElementById("loginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginButton");


const messageBox =
    document.getElementById("message");


const forgotPassword =
    document.getElementById("forgotPassword");



function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className =
        "message " +
        (type || "error");

}



function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";

}



/* ==========================================
   SAVE LOGIN SESSION
========================================== */

function saveSession(data) {

    if (data.access_token) {

        localStorage.setItem(
            "nexora_access_token",
            data.access_token
        );

    }


    if (data.refresh_token) {

        localStorage.setItem(
            "nexora_refresh_token",
            data.refresh_token
        );

    }

}



/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";


        try {

            /*
              Authenticate with Supabase.
            */

            const response =
                await fetch(
                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                    {
                        method: "POST",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email:
                                email,

                            password:
                                password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error_description ||
                    data.msg ||
                    data.message ||
                    "Invalid email or password."
                );

            }


            if (!data.access_token) {

                throw new Error(
                    "Login succeeded but no session was returned."
                );

            }


            /*
              Save the authenticated session.
            */

            saveSession(data);


            /*
              IMPORTANT ADMIN ROUTE
              =====================
              
              This account is the Nexora admin account.

              When this exact email successfully
              authenticates, go directly to Admin V3.

              No database profile lookup is needed
              for the redirect.
            */

            if (
                email ===
                "jeff1234@gmail.com"
            ) {

                showMessage(
                    "Admin account detected. Opening Admin V3...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.replace(
                            "./admin.html?v=4000"
                        );

                    },
                    300
                );


                return;

            }


            /*
              Every other account goes to
              the normal dashboard.
            */

            showMessage(
                "Login successful. Opening your dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        "./dashboard.html?v=4000"
                    );

                },
                300
            );

        } catch (error) {

            console.error(
                "Nexora login error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to sign in. Please try again."
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Sign in";

        }

    }
);



/* ==========================================
   FORGOT PASSWORD
========================================== */

forgotPassword.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        showMessage(
            "Password reset is not configured yet."
        );

    }
);

</script>

</body>
</html>
