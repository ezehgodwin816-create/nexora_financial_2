<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Financial — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f9;
    color: #12202b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.auth {
    width: 100%;
    max-width: 420px;
}

.panel {
    background: #fff;
    border: 1px solid #e3e8ec;
    border-radius: 16px;
    padding: 34px;
    box-shadow: 0 8px 30px rgba(18,32,43,.07);
}

.brand {
    text-align: center;
    margin-bottom: 32px;
}

.brand h1 {
    margin: 0;
    font-size: 29px;
    letter-spacing: 1.5px;
    font-weight: 800;
}

.brand p {
    margin: 8px 0 0;
    color: #7a8791;
    font-size: 14px;
}

h2 {
    margin: 0 0 24px;
    font-size: 24px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #d5dde2;
    border-radius: 9px;
    background: #fff;
    color: #12202b;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #12202b;
    box-shadow: 0 0 0 3px rgba(18,32,43,.08);
}

button {
    width: 100%;
    height: 48px;
    margin-top: 4px;
    border: 0;
    border-radius: 9px;
    background: #12202b;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    display: none;
}

.message.error {
    display: block;
    background: #fff1f1;
    color: #b42318;
    border: 1px solid #ffd4d4;
}

.message.success {
    display: block;
    background: #eef9f2;
    color: #18753c;
    border: 1px solid #ccebd7;
}

.register {
    text-align: center;
    margin-top: 22px;
    color: #7a8791;
    font-size: 14px;
}

.register a {
    color: #12202b;
    font-weight: 700;
    text-decoration: none;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #9aa5ad;
    font-size: 12px;
}
</style></head><body><div class="auth"><div class="panel"><div class="brand">
<h1>NEXORA</h1>
<p>Financial Services</p>
</div><h2>Welcome back</h2><form id="loginForm"><div class="field">
<label for="email">Email</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>
</div><div class="field">
<label for="password">Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>
</div><button type="submit" id="loginButton">
Sign In
</button></form><div id="message" class="message"></div><div class="register">
Don't have an account?
<a href="./register.html">Create account</a>
</div></div><div class="footer">
Nexora Financial
</div></div><script>

const SUPABASE_URL =
"https://enstgbpcgkdnwhhlsnhh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");


function showError(text) {

    message.className = "message error";
    message.textContent = text;

}


function showSuccess(text) {

    message.className = "message success";
    message.textContent = text;

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Signing in...";

    message.className = "message";
    message.textContent = "";

    try {

        const result =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (result.error) {
            throw result.error;
        }

        const user =
            result.data.user;

        if (!user) {
            throw new Error("Unable to create a login session.");
        }


        /*
         * IMPORTANT:
         * Only an account whose profile explicitly has
         * is_admin = true is allowed into admin.html.
         */

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select("is_admin")
                .eq("id", user.id)
                .maybeSingle();


        if (profileResult.error) {

            console.error(
                "Profile check failed:",
                profileResult.error
            );

            /*
             * Authentication succeeded but the profile
             * could not be read.
             *
             * Fail safely into the normal dashboard.
             */

            showSuccess(
                "Login successful. Opening dashboard..."
            );

            setTimeout(function() {
                window.location.replace(
                    "./dashboard.html"
                );
            }, 400);

            return;
        }


        const isAdmin =
            profileResult.data &&
            profileResult.data.is_admin === true;


        if (isAdmin) {

            showSuccess(
                "Login successful. Opening admin dashboard..."
            );

            setTimeout(function() {
                window.location.replace(
                    "./admin.html"
                );
            }, 400);

            return;
        }


        /*
         * Every non-admin account goes here.
         */

        showSuccess(
            "Login successful. Opening dashboard..."
        );

        setTimeout(function() {
            window.location.replace(
                "./dashboard.html"
            );
        }, 400);

    } catch (error) {

        console.error(
            "Login error:",
            error
        );

        showError(
            error.message ||
            "Unable to sign in. Please check your email and password."
        );

        button.disabled = false;
        button.textContent = "Sign In";
    }

});

</script></body>
</html>
