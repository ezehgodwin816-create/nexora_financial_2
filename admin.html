<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexora Admin</title>
    <link rel="stylesheet" href="./assets/style.css">
</head><body class="dashboard-body"><div class="demo">
    NEXORA ADMIN · DEMO ONLY
</div><header>
    <a class="brand" href="./index.html">
        NEXORA
        <span>FINANCIAL</span>
    </a>
</header><main class="dash"><div class="dash-top">
    <div>
        <div class="eyebrow">NEXORA ADMINISTRATION</div>
        <h1>Demo account management.</h1>
        <p>Admin control panel.</p>
    </div>
</div>

<div id="status"
     class="dashboard-card"
     style="margin-top:20px;">
    Checking admin access...
</div>

<div id="users"
     class="dashboard-card"
     style="margin-top:20px; display:none;">
</div>

</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
    "https://krzxqmzvzgjmolepcnbg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YBTYFY_vqnZkncmCclQa8w_ZKB0Cyul";


const statusBox =
    document.getElementById("status");

const usersBox =
    document.getElementById("users");


function show(message, good = false) {

    statusBox.innerHTML = `
        <h2 style="margin-bottom:10px;">
            ${good ? "✓ " : "⚠ "}
            ${message}
        </h2>
    `;

}


/* Check that Supabase loaded */

if (!window.supabase) {

    show(
        "Supabase library did not load. Check your internet connection."
    );

} else {

    start();

}


async function start() {

    try {

        show("Supabase loaded. Checking your login...");


        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const {
            data,
            error
        } =
            await client.auth.getSession();


        if (error) {

            show(
                "Login session error: " +
                error.message
            );

            return;
        }


        if (!data.session) {

            show(
                "You are not signed in. Go to login.html and sign in with your admin account."
            );

            return;
        }


        const user =
            data.session.user;


        show(
            "Signed in successfully. Checking admin permission..."
        );


        const {
            data: admin,
            error: adminError
        } =
            await client.rpc(
                "is_admin"
            );


        if (adminError) {

            show(
                "Admin check failed: " +
                adminError.message
            );

            return;
        }


        if (admin !== true) {

            show(
                "This account is NOT marked as an admin in Supabase."
            );

            return;
        }


        show(
            "Admin access confirmed. Loading users...",
            true
        );


        const {
            data: profiles,
            error: profileError
        } =
            await client
                .from("profiles")
                .select("*");


        if (profileError) {

            show(
                "Admin access works, but loading profiles failed: " +
                profileError.message
            );

            return;
        }


        usersBox.style.display =
            "block";


        if (!profiles || profiles.length === 0) {

            usersBox.innerHTML = `
                <h2>No profiles found</h2>
                <p>
                    Your profiles table currently contains no users.
                </p>
            `;

            return;
        }


        usersBox.innerHTML = `
            <div class="eyebrow">
                CUSTOMERS
            </div>

            <h2>
                Demo users
            </h2>

            ${profiles.map(profile => `

                <div style="
                    padding:18px 0;
                    border-bottom:1px solid #e5e9ea;
                ">

                    <strong>
                        ${profile.name || "Unnamed user"}
                    </strong>

                    <br>

                    <small>
                        ${profile.email || "No email"}
                    </small>

                    <br><br>

                    <strong>
                        £${Number(
                            profile.balance || 0
                        ).toFixed(2)}
                    </strong>

                </div>

            `).join("")}
        `;


        statusBox.innerHTML = `
            <h2>✓ Admin connected successfully</h2>
            <p>
                Your admin account can access the profiles table.
            </p>
        `;


    } catch (error) {

        show(
            "Unexpected error: " +
            error.message
        );

        console.error(error);

    }

}

</script></body>
</html>
