>

</div>

        display:none;

    "
><div class="eyebrow">

</div>

</h2>

</p>


<div style="
    background:#f3f6f6;
    border-radius:14px;

    margin:20px 0;
">

    <small>

    </small>

    <div
        id="currentBalance"
        style="
            font-size:30px;
            font-weight:700;
            margin-top:8px;
        "
    >
        £0.00
    </div>

</div>


<label>

    Amount

    <input
        id="amount"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="100.00"
        style="
            width:100%;
            box-sizing:border-box;

            border:1px solid #dfe5e7;

    >

</label>

    display:block;
    margin-top:15px;
">

    Description

    <input
        id="description"
        type="text"
        maxlength="100"
        placeholder="Demo balance adjustment"
        style="
            width:100%;
            box-sizing:border-box;
            padding:14px;
            margin-top:8px;
            border:1px solid #dfe5e7;
            border-radius:10px;
            font-size:14px;
        "
    >

</label>


<div style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
">

    <button
        id="addBtn"
        class="btn green"
        type="button"
        onclick="changeBalance('add')"
    >
        + Add demo funds
    </button>


    <button
        id="removeBtn"
        class="btn"
        type="button"
        onclick="changeBalance('withdraw')"
    >
        − Deduct demo funds
    </button>

</div>


<div
    id="message"
    style="
        margin-top:15px;
        font-size:13px;
    "
></div>

</section></main><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><script>

let users = [];
let selectedUser = null;


/* =================================
   START
================================= */

start();


async function start() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {
            throw error;
        }


        if (
            !data.session ||
            !data.session.user
        ) {

            window.location.href =
                "./login.html";

            return;
        }


        /*
         * Check administrator permission.
         */

        const {
            data: admin,
            error: adminError
        } = await supabaseClient.rpc(
            "is_admin"
        );


        if (
            adminError ||
            admin !== true
        ) {

            showAccessDenied();

            return;
        }


        await loadUsers();

    } catch (error) {

        console.error(
            "Admin startup error:",
            error
        );

        showAccessDenied();

    }

}


/* =================================
   ACCESS DENIED
================================= */

function showAccessDenied() {

    document.querySelector("main").innerHTML = `

        <section class="dashboard-card">

            <div class="eyebrow">
                NEXORA ADMINISTRATION
            </div>

            <h2>
                Access denied
            </h2>

            <p>
                This account is not authorised to access
                the Nexora demo administration area.
            </p>

            <a
                class="btn"
                href="./dashboard.html"
            >
                Back to dashboard
            </a>

        </section>

    `;

}


/* =================================
   LOAD USERS
================================= */

async function loadUsers() {

    const container =
        document.getElementById("users");


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .order(
            "email",
            {
                ascending:true
            }
        );


    if (error) {

        container.innerHTML = `

            <div style="
                color:#c3444d;
                padding:20px 0;
            ">

                Unable to load demo users.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

        return;
    }


    users = data || [];


    displayUsers(users);

}


/* =================================
   DISPLAY USERS
================================= */

function displayUsers(list) {

    const container =
        document.getElementById("users");


    if (!list.length) {

        container.innerHTML = `

            <p style="
                color:#8b98a1;
                padding:20px 0;
            ">
                No demo users found.
            </p>

        `;

        return;
    }


    container.innerHTML =
        list.map(user => {

            const name =
                user.full_name ||
                user.name ||
                "Unnamed user";


            const email =
                user.email ||
                "No email";


            const balance =
                Number(user.balance || 0);


            return `

                <button
                    type="button"
                    onclick="selectUser('${escapeAttribute(user.id)}')"
                    style="
                        width:100%;
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:15px;
                        padding:18px 5px;
                        background:none;
                        border:0;
                        border-bottom:1px solid #edf0f1;
                        text-align:left;
                        cursor:pointer;
                    "
                >

                    <div>

                        <strong style="
                            display:block;
                            color:#101820;
                        ">
                            ${escapeHtml(name)}
                        </strong>

                        <small style="
                            color:#8b98a1;
                        ">
                            ${escapeHtml(email)}
                        </small>

                    </div>

                    <strong>
                        £${balance.toLocaleString(
                            "en-GB",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}
                    </strong>

                </button>

            `;

        }).join("");

}


/* =================================
   SEARCH
================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            const value =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                users.filter(user => {

                    const name =
                        String(
                            user.full_name ||
                            user.name ||
                            ""
                        ).toLowerCase();


                    const email =
                        String(
                            user.email ||
                            ""
                        ).toLowerCase();


                    return (
                        name.includes(value) ||
                        email.includes(value)
                    );

                });


            displayUsers(filtered);

        }
    );


/* =================================
   SELECT USER
================================= */

function selectUser(id) {

    selectedUser =
        users.find(
            user =>
                String(user.id) === String(id)
        );


    if (!selectedUser) {
        return;
    }


    const name =
        selectedUser.full_name ||
        selectedUser.name ||
        "Unnamed user";


    const email =
        selectedUser.email ||
        "No email";


    document.getElementById(
        "editor"
    ).style.display = "block";


    document.getElementById(
        "customerName"
    ).textContent =
        name;


    document.getElementById(
        "customerEmail"
    ).textContent =
        email;


    updateBalanceDisplay();


    document.getElementById(
        "message"
    ).textContent = "";


    document.getElementById(
        "amount"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "editor"
    ).scrollIntoView({
        behavior:"smooth"
    });

}


/* =================================
   BALANCE DISPLAY
================================= */

function updateBalanceDisplay() {

    if (!selectedUser) {
        return;
    }


    const balance =
        Number(
            selectedUser.balance || 0
        );


    document.getElementById(
        "currentBalance"
    ).textContent =
        "£" +
        balance.toLocaleString(
            "en-GB",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =================================
   CHANGE DEMO BALANCE
================================= */

async function changeBalance(type) {

    if (!selectedUser) {
        return;
    }


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        message.textContent =
            "Enter a valid amount.";


        message.style.color =
            "#c3444d";


        return;
    }


    const oldBalance =
        Number(
            selectedUser.balance || 0
        );


    let newBalance;


    if (type === "add") {

        newBalance =
            oldBalance + amount;

    } else {

        if (amount > oldBalance) {

            message.textContent =
                "The simulated balance cannot go below £0.00.";


            message.style.color =
                "#c3444d";


            return;
        }


        newBalance =
            oldBalance - amount;

    }


    document.getElementById(
        "addBtn"
    ).disabled = true;


    document.getElementById(
        "removeBtn"
    ).disabled = true;


    message.textContent =
        "Updating demo account...";


    message.style.color =
        "#6f7c84";


    try {

        /*
         * Update simulated balance.
         */

        const {
            error: updateError
        } = await supabaseClient
            .from("profiles")
            .update({
                balance:newBalance
            })
            .eq(
                "id",
                selectedUser.id
            );


        if (updateError) {
            throw updateError;
        }


        /*
         * Try to record the simulated activity.
         */

        const {
            error: transactionError
        } = await supabaseClient
            .from("transactions")
            .insert({

                user_id:
                    selectedUser.id,

                type:
                    type,

                amount:
                    amount,

                description:
                    description ||
                    (
                        type === "add"
                            ? "Admin added demo funds"
                            : "Admin deducted demo funds"
                    )

            });


        /*
         * A transaction error does not undo the
         * balance update. It is reported in console
         * because the transaction table may not exist yet.
         */

        if (transactionError) {

            console.warn(
                "Transaction was not recorded:",
                transactionError.message
            );

        }


        /*
         * Update local display.
         */

        selectedUser.balance =
            newBalance;


        updateBalanceDisplay();


        displayUsers(users);


        message.textContent =
            type === "add"
                ? "✓ Simulated funds added successfully."
                : "✓ Simulated funds deducted successfully.";


        message.style.color =
            "#2f7d4a";


        document.getElementById(
            "amount"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


    } catch (error) {

        console.error(
            "Balance update error:",
            error
        );


        message.textContent =
            "Unable to update the demo balance: " +
            error.message;


        message.style.color =
            "#c3444d";

    }


    document.getElementById(
        "addBtn"
    ).disabled = false;


    document.getElementById(
        "removeBtn"
    ).disabled = false;

}


/* =================================
   LOG OUT
================================= */

async function logout(event) {

    event.preventDefault();


    try {

        await supabaseClient.auth.signOut();

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        "nexoraLoggedIn"
    );


    localStorage.removeItem(
        "nexoraUserId"
    );


    window.location.href =
        "./index.html";

}


/* =================================
   HTML ESCAPING
================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value)
        .replace(
            /'/g,
            "\\'"
        );

}

</script></body>
