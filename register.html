<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Nexora Financial</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06111f, #0b1d33);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .logo span {
            color: #28d7ff;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9eacbd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            margin-bottom: 17px;
            font-size: 15px;
        }

        input:focus {
            border-color: #28d7ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #19c9ff, #247cff);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.3);
            color: #ff9d9d;
        }

        .success {
            display: block;
            background: rgba(30, 220, 130, 0.12);
            border: 1px solid rgba(30, 220, 130, 0.3);
            color: #7ff0b2;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #9eacbd;
        }

        .login a {
            color: #28d7ff;
            text-decoration: none;
            font-weight: 700;
        }

        .demo {
            text-align: center;
            margin-top: 18px;
            color: #66788d;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        NEXORA <span>FINANCIAL</span>
    </div>

    <div class="card">

        <h1>Create your account</h1>

        <p class="subtitle">
            Open your simulated Nexora Financial account.
        </p>

        <form id="registerForm">

            <label for="name">Full name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="login">
            Already have an account?
            <a href="./login.html">Sign in</a>
        </div>

        <div class="demo">
            NEXORA FINANCIAL · SIMULATED BANKING EXPERIENCE
        </div>

    </div>

</div>


<script>

/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://enstgbpcgkdnwhhlsnhh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   DASHBOARD
============================================================ */

const DASHBOARD_URL =
    "./dashboard.html?v=4000";


/* ============================================================
   ELEMENTS
============================================================ */

const form =
    document.getElementById(
        "registerForm"
    );

const registerBtn =
    document.getElementById(
        "registerBtn"
    );

const message =
    document.getElementById(
        "message"
    );


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;
}


/* ============================================================
   REGISTRATION
============================================================ */

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (
            !name ||
            !email ||
            !password
        ) {

            showMessage(
                "Please complete all fields.",
                "error"
            );

            return;
        }


        if (
            password.length < 6
        ) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        /* ----------------------------------------------------
           BUTTON
        ---------------------------------------------------- */

        registerBtn.disabled =
            true;

        registerBtn.textContent =
            "Creating account...";

        message.className =
            "message";


        try {

            /* ------------------------------------------------
               CREATE AUTH ACCOUNT

               The full_name metadata is picked up by the
               database trigger and stored in profiles.name.
            ------------------------------------------------ */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        data: {

                            full_name:
                                name,

                            name:
                                name

                        }

                    }

                });


            if (error) {
                throw error;
            }


            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Account could not be created."
                );
            }


            /* ------------------------------------------------
               SAVE USER ID
            ------------------------------------------------ */

            localStorage.setItem(
                "nexoraUserId",
                data.user.id
            );


            /* ------------------------------------------------
               SESSION AVAILABLE
            ------------------------------------------------ */

            if (data.session) {

                showMessage(
                    "Account created successfully. Redirecting to your Nexora dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            DASHBOARD_URL;

                    },
                    800
                );


            } else {

                /* --------------------------------------------
                   EMAIL CONFIRMATION / NO SESSION
                -------------------------------------------- */

                showMessage(
                    "Account created. Please sign in to continue.",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "./login.html?v=4000";

                    },
                    1200
                );

            }


        } catch (error) {

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            let errorMessage =
                error.message ||
                "Registration failed.";


            const lowerMessage =
                errorMessage.toLowerCase();


            if (
                lowerMessage.includes(
                    "already registered"
                )
            ) {

                errorMessage =
                    "An account with this email already exists.";

            }


            else if (
                lowerMessage.includes(
                    "password"
                )
            ) {

                errorMessage =
                    "Please use a password with at least 6 characters.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";

        }

    }
);

</script>

</body>
</html>
