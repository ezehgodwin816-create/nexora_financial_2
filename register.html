<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Nexora Financial</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06111f, #0b1d33);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .logo span {
            color: #28d7ff;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9eacbd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            margin-bottom: 17px;
            font-size: 15px;
        }

        select option {
            background: #0b1d33;
            color: white;
        }

        input:focus, select:focus {
            border-color: #28d7ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #19c9ff, #247cff);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.3);
            color: #ff9d9d;
        }

        .success {
            display: block;
            background: rgba(30, 220, 130, 0.12);
            border: 1px solid rgba(30, 220, 130, 0.3);
            color: #7ff0b2;
        }

        .country-details {
            margin-bottom: 4px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #9eacbd;
        }

        .login a {
            color: #28d7ff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        NEXORA <span>FINANCIAL</span>
    </div>

    <div class="card">

        <h1>Create your account</h1>

        <p class="subtitle">
            Open your Nexora Financial account. All information is for account verification.
        </p>

        <form id="registerForm">

            <label for="firstName">First name</label>
            <input
                type="text"
                id="firstName"
                placeholder="First name"
                autocomplete="given-name"
                required
            >

            <label for="middleName">Middle name</label>
            <input
                type="text"
                id="middleName"
                placeholder="Middle name"
                autocomplete="additional-name"
            >

            <label for="lastName">Last name</label>
            <input
                type="text"
                id="lastName"
                placeholder="Last name"
                autocomplete="family-name"
                required
            >

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password (min 6 characters)"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <label for="phone">Mobile number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your mobile number"
                autocomplete="tel"
                required
            >

            <label for="country">Country</label>
            <select id="country" required>
                <option value="">Select your country</option>
                <option value="United States">United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Canada">Canada</option>
                <option value="Nigeria">Nigeria</option>
                <option value="Ghana">Ghana</option>
                <option value="South Africa">South Africa</option>
                <option value="Kenya">Kenya</option>
                <option value="India">India</option>
                <option value="Australia">Australia</option>
                <option value="Germany">Germany</option>
                <option value="France">France</option>
                <option value="Other">Other</option>
            </select>

            <label for="dob">Date of birth</label>
            <input type="date" id="dob" required>

            <!-- UNITED STATES SECTION -->
            <div id="us-details" class="country-details" hidden>

                <label for="us-socialsecuritynumber(SSN)1">social security number</label>
                <input type="text" id="us-socialsecuritynumber(SSN)1" placeholder="social security number (SSN)">

                <label for="us-passportnumber2">passport number</label>
                <input type="text" id="us-passportnumber2" placeholder="passport number">

                <label for="us-stateidnumber3">state ID number</label>
                <input type="text" id="us-stateidnumber3" placeholder="state ID number">

                <label for="us-driver'slicense">driver's license</label>
                <input
                    type="file"
                    id="us-driver'slicense"
                    accept="image/*,.pdf,.doc,.docx"
                    multiple
                >

            </div>

            <!-- UNITED KINGDOM SECTION -->
            <div id="uk-details" class="country-details" hidden>

                <label for="uk-nationalinsurancenumber">national insurance number</label>
                <input type="text" id="uk-nationalinsurancenumber1" placeholder="national insurance number">

                <label for="uk-passportnumber2">passport number</label>
                <input type="text" id="uk-passportnumber2" placeholder="passport number">

                <label for="uk-drivinglicencenumber3">driving licence number</label>
                <input type="file" id="uk-drivinglicencenumber3" accept="image/*,.pdf,.doc,.docx" multiple>

                <label for="uk-IDphoto4">ID photo</label>
                <input type="file" id="uk-IDphoto4" accept="image/*,.pdf,.doc,.docx" multiple>

            </div>

            <label for="currentAddress">Current address</label>
            <input
                type="text"
                id="currentAddress"
                placeholder="Street, city, postcode"
                autocomplete="street-address"
                required
            >

            <label for="previousAddress">Previous address (optional)</label>
            <input
                type="text"
                id="previousAddress"
                placeholder="Previous street, city, postcode"
            >

            <label for="occupation">Occupation</label>
            <input
                type="text"
                id="occupation"
                placeholder="Your occupation"
                required
            >

            <button type="submit" id="registerBtn">
                Create Account
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="login">
            Already have an account?
            <a href="./login.html">Sign in</a>
        </div>

    </div>
</div>

<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://enstgbpcgkdnwhhlsnhh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0ecSKgmH9JIzdX9_3j5Kww_aNdNr_qT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   DASHBOARD
============================================================ */

const DASHBOARD_URL =
    "./dashboard.html?v=8000";


/* ============================================================
   ELEMENTS
============================================================ */

const form =
    document.getElementById("registerForm");

const registerBtn =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");

const country =
    document.getElementById("country");

const usDetails =
    document.getElementById("us-details");

const ukDetails =
    document.getElementById("uk-details");


/* ============================================================
   COUNTRY SECTIONS
============================================================ */

function updateCountryDetails() {

    const selectedCountry = country.value;

    usDetails.hidden =
        selectedCountry !== "United States";

    ukDetails.hidden =
        selectedCountry !== "United Kingdom";
}

country.addEventListener(
    "change",
    updateCountryDetails
);

updateCountryDetails();


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* ============================================================
   REGISTRATION
============================================================ */

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const firstName =
            document.getElementById("firstName").value.trim();

        const middleName =
            document.getElementById("middleName").value.trim();

        const lastName =
            document.getElementById("lastName").value.trim();

        const fullName =
            [firstName, middleName, lastName]
                .filter(Boolean)
                .join(" ");

        const email =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("password").value;

        const phone =
            document.getElementById("phone")
                .value
                .trim();

        const selectedCountry =
            document.getElementById("country").value;

        const dob =
            document.getElementById("dob").value;

        const currentAddress =
            document.getElementById("currentAddress")
                .value
                .trim();

        const previousAddress =
            document.getElementById("previousAddress")
                .value
                .trim();

        const occupation =
            document.getElementById("occupation")
                .value
                .trim();


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (
            !firstName ||
            !lastName ||
            !email ||
            !password ||
            !phone ||
            !selectedCountry ||
            !dob ||
            !currentAddress ||
            !occupation
            !IDphoto ||
            !socialsecuritynumber(SSN) ||
            !driver'slicense
            !driver'slicense
            !stateidnumber
            ! passportnumber
            !nationalinsurancenumber
            !passportnumber
            !drivinglicencenumber
            !IDphoto
        ) {

            showMessage(
                "Please complete all required fields.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        /* ----------------------------------------------------
           BUTTON
        ---------------------------------------------------- */

        registerBtn.disabled = true;

        registerBtn.textContent =
            "Creating account...";

        message.className =
            "message";


        try {

            /* ------------------------------------------------
               CLEAR ONLY NEXORA LOCAL SESSION DATA
            ------------------------------------------------ */

            localStorage.removeItem(
                "nexora_access_token"
            );

            localStorage.removeItem(
                "nexora_refresh_token"
            );

            localStorage.removeItem(
                "nexoraUserId"
            );


            /* ------------------------------------------------
               CREATE AUTH ACCOUNT
            ------------------------------------------------ */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name: fullName,
                            name: fullName,
                            first_name: firstName,
                            middle_name: middleName,
                            last_name: lastName,
                            phone: phone,
                            country: selectedCountry,
                            date_of_birth: dob,
                            current_address: currentAddress,
                            previous_address: previousAddress,
                            occupation: occupation

                        }

                    }

                });


            if (error) {
                throw error;
            }


            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Account could not be created."
                );
            }


            /* ------------------------------------------------
               MAKE THE NEW USER SESSION ACTIVE
            ------------------------------------------------ */

            if (data.session) {

                localStorage.setItem(
                    "nexora_access_token",
                    data.session.access_token
                );

                localStorage.setItem(
                    "nexora_refresh_token",
                    data.session.refresh_token
                );

                localStorage.setItem(
                    "nexoraUserId",
                    data.user.id
                );


                showMessage(
                    "Successfully signed up! Your details are being processed. You can continue using your account. We will contact you if any information is missing or needs correction.",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.replace(
                            DASHBOARD_URL
                        );

                    },
                    3500
                );


            } else {

                /* --------------------------------------------
                   EMAIL CONFIRMATION / NO SESSION
                -------------------------------------------- */

                localStorage.setItem(
                    "nexoraUserId",
                    data.user.id
                );


                showMessage(
                    "Successfully signed up! Your details are being processed. Please sign in to continue using your account. We will contact you if any information is missing or needs correction.",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.replace(
                            "./login.html?v=8000"
                        );

                    },
                    3500
                );

            }


        } catch (error) {

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            let errorMessage =
                error.message ||
                "Registration failed.";


            const lowerMessage =
                errorMessage.toLowerCase();


            if (
                lowerMessage.includes(
                    "already registered"
                )
            ) {

                errorMessage =
                    "An account with this email already exists.";

            } else if (
                lowerMessage.includes(
                    "password"
                )
            ) {

                errorMessage =
                    "Please use a password with at least 6 characters.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";

        }

    }
);
</script>

</body>
</html>
